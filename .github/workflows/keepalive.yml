# Second, independent keep-alive.
#
# The Vercel cron alone did not keep the project alive: Supabase flagged it
# for 7+ days of insufficient activity on 2026-08-25. Vercel's docs say
# Hobby-plan crons are not assured to fire, and the project lives under a
# Vercel account we cannot inspect, so its cron cannot be verified from here.
#
# This pings Supabase directly, with no dependency on Vercel. It runs every
# 8 hours rather than daily: GitHub delays or drops scheduled runs under load,
# so three chances a day means ~21 chances inside any 7-day pause window.
#
# The key below is the publishable key, which already ships in join.html.
# It can only call heartbeat() and insert signups; it cannot read anything.
#
# Caveat: GitHub disables scheduled workflows on public repos after 60 days
# with no repository activity. Re-enable from the Actions tab if that happens.

name: keepalive

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase heartbeat
        env:
          SUPABASE_URL: https://wzmnyrlpjdlkdpidicmg.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_vsMDWt6WzHfkdTeSQOYoOA_7umaXGwF
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/hb.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/heartbeat" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "HTTP $code — $(cat /tmp/hb.json)"
          test "$code" = "200"
